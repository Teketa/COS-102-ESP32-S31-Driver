; COS-102 LED sign controller — ESP32-S31-Function-CoreBoard-1 + COS-102 hat
; ESP-IDF under PlatformIO. The official platformio/espressif32 platform does
; not support the S31 yet; the pioarduino fork does (ESP-IDF 6.1.1).
[env:esp32s31]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = espidf
board = esp32-s31-coreboard-1
board_build.partitions = partitions.csv
; Console + flashing over the CoreBoard's USB-to-UART port (UART0, GPIO58/59).
monitor_speed = 115200
monitor_filters = direct
upload_speed = 921600
; Regenerates src/web_index.c from src/web/index.html before every build.
extra_scripts = pre:tools/gen_web.py
build_flags =
    -O2
